name: CI

# Cheap ubuntu job on every push and pull request; the macOS jobs (10x minutes) run only by hand:
# Actions -> CI -> Run workflow.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**/*.md']
  pull_request:
    paths-ignore: ['site/**', '**/*.md']
  workflow_dispatch:
    inputs:
      app:
        description: Also build the desktop app (universal macOS, the most expensive job)
        type: boolean
        default: false

permissions:
  contents: read

# A newer run on the same branch replaces one still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick (ubuntu: npm check + cargo check/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Rust core
        run: |
          cargo check --manifest-path packages/app/core/Cargo.toml
          cargo test --manifest-path packages/app/core/Cargo.toml
      - name: Rust desktop shell (Tauri needs GTK/WebKit on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          cargo check --manifest-path packages/app/src-tauri/Cargo.toml
          cargo test --manifest-path packages/app/src-tauri/Cargo.toml

  check:
    name: check (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci

      - name: Generated contract files are up to date
        run: |
          npm run gen
          git diff --exit-code -- packages/contract/src/generated

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rust core tests
        run: cargo test --manifest-path packages/app/core/Cargo.toml

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { [ "$RUNNER_OS" = macOS ] && brew install shellcheck || sudo apt-get install -y shellcheck; }
          shellcheck bootstrap.sh

      - name: apply --dry-run smoke test (macOS only)
        if: runner.os == 'macOS'
        run: |
          export HOME="$(mktemp -d)"
          CLI="$GITHUB_WORKSPACE/packages/cli/dist/cli.js"
          node "$CLI" init --yes --hostname ci-mini
          node "$CLI" apply --dry-run
          node "$CLI" uninstall --dry-run
          # --json must be NDJSON ending in a result event.
          node "$CLI" apply --dry-run --json | tail -n 1 | node -e '
            const l = require("fs").readFileSync(0, "utf8");
            const e = JSON.parse(l);
            if (e.type !== "result" || e.ok !== true || e.data.dryRun !== true) { console.error(l); process.exit(1); }'

  app:
    name: "desktop app (universal macOS: arm64 + x86_64)"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.app }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Tauri build (universal binary)
        run: npm run tauri:build -w @devhost/app
      - uses: actions/upload-artifact@v7
        with:
          name: devhost-desktop-app
          path: packages/app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
