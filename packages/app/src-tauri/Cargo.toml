[package]
name = "devhost-desktop"
version = "0.1.0"
edition = "2021"
description = "devhost Desktop: configure and watch the devhost Mac mini from a MacBook"
license = "UNLICENSED"

[lib]
name = "devhost_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0.185", features = ["derive"] }
serde_json = "1"
devhost-core = { path = "../core" }

# The menu bar item's appearance (dark or light menu bar) for the status icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSButton", "NSControl", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
